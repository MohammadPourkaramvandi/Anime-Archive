<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./static/css/item-list.css">
    <title>Document</title>
</head>
<body>
    <div style="margin: 50px;">

        <div class="anime-list-container">

            <div class="anime-list-item">
                <div class="anime-list-image-div">
                    <img src="../../../ScreenShot/download.jpg" alt="">
                </div>
                <div class="anime-list-item-name-p">
                    <div class="anime-list-item-name">
                        <p>{{ AnimeItems.title }}</p>
                    </div>
                </div>
                <div class="anime-list-item-seasone">
                    <p>Seasone : {{ AnimeItems.seasone }}</p>
                </div>
                <div class="anime-list-item-episod">
                    <p>Episode : {{ AnimeItems.episode }}</p>
                </div>
                <button class="button">
                    Edit
                </button>
            </div>

        </div>

    </div>
    
</body>
</html>
